# C-q works for me better than C-b (too far) or C-a (used by readline)
set -g prefix C-q
unbind C-b

# reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# mute or unmute window
bind m {
  set -w monitor-bell
  set -w monitor-activity
  display "window mute #{?#{monitor-bell},off,on}"
}

# setting the dealy between prefix and command (+responsive)
set -s escape-time 0
set -sg repeat-time 600

# Pass through focus events from terminal to applications
set -s focus-events on

# start numbering windows and panes at 1
set -g base-index 1
set -g pane-base-index 1

# always renumber windows
set-option -g renumber-windows on

# Set bell/ring enabled
set-window-option -g visual-bell off
set-window-option -g bell-action any

# -- window management --------------------------------------------------

# split panes
bind | split-window -h
bind s split-window -h
bind \\ split-window -h
bind - split-window -v
bind = split-window -v
bind v split-window -v

# move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# quick pane selection
bind-key -r C-h previous-window
bind-key -r C-l next-window
bind Tab last-window        # move to last active window

# fine pane resizing
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# coarse pane resizing
bind -r C-H resize-pane -L 5
bind -r C-J resize-pane -D 5
bind -r C-K resize-pane -U 5
bind -r C-L resize-pane -R 5

# ALT-Z - toggle fullscreen
bind -n M-z resize-pane -Z

# open new window in current directory
bind c new-window -c '#{pane_current_path}' -a -t '{next}'
bind -n M-c new-window -c '#{pane_current_path}' -a -t '{next}'

# mouse support
set -g mouse on

# copy to OS clipboard
set -g set-clipboard on

# Don't keep windows around after they exit
set -g remain-on-exit off

# enable activity monitor
setw -g monitor-activity on
set -g visual-activity on

set-window-option -g visual-bell on
set-window-option -g bell-action none

# automatically name windows
set -g set-titles on
set -g set-titles-string "#W"

# launch current user shell in new windows
set-option -g default-shell $SHELL

# increase history scrollback
set -g history-limit 32768

# enable vi keys
setw -g mode-keys vi

#set -g mode-keys emacs
set -g status-keys emacs

# -- status bar --
set -g allow-rename on

# https://unix.stackexchange.com/questions/141311/tmux-hightlight-colour-settings
#set -g mode-style "fg=colour81,bg=colour234"

# Define a gradient color scheme
set -g status-style "bg=#44475a,fg=#f8f8f2"
set -g message-style "bg=colour81,fg=colour234,bold"

# Window list style
set -g window-status-format "#[fg=colour244,bg=colour234] #I #W #F"
set -g window-status-current-format "#[fg=colour234,bg=colour81,bold] #I #W #[fg=colour81,bg=colour234,nobold]"

# Pane border style
setw -g pane-active-border-style "bg=colour0,fg=colour81"
setw -g pane-border-style "bg=colour0,fg=colour234"

# -- copy mode -----------------------------------------------------------------
unbind Escape
bind Enter copy-mode # enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# CTRL-A, CTRL-E in copy mode
bind -T copy-mode-vi -r C-a send-keys -X start-of-line
bind -T copy-mode-vi -r C-e send-keys -X end-of-line

# Search forward in copy-mode
bind -T copy-mode-vi / send -X search-forward
bind -T copy-mode-vi ? send search-backward

# page-up and page-down
bind -r PPage copy-mode -u
# XXX: fix this
# bind -r NPage copy-mode -d
bind -r NPage send -X page-down

# mod-up and mod-down
bind -r M-Up copy-mode -u
# bind -r M-Down copy-mode -d
bind -r M-Down send -X page-down

# nav from copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
#bind-key -T copy-mode-vi 'C-t' select-pane -l

# buffers
bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from

bind C-p display-menu -T "#[align=centre fg=yellow]Commands Menu" \
    "Synchronize Panes ON (s)"  s 'setw synchronize-panes on' \
    "Synchronize Panes OFF (x)" x 'setw synchronize-panes off' \
    "List buffers (l)"         l 'send-keys "your-command-here" C-m'

# Status bar
#set -g default-terminal "tmux-256color"
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

set -g status-style "bg=#1c1c1c,fg=#d0d0d0"

# Toggle status line (prefix + q)
bind-key q set-option -g status

set -g status-left-length 25
set -g status-left "#{?client_prefix,#[bg=d75f00]#[#ffffff]#[bold] PREFIX , #[bg=#3a3a3a]#[fg=#ffffff]#[bold] #S }#[default] "

setw -g window-status-format "#[fg=#8a8a8a] #I:#W#{?window_flags,#F, } "
setw -g window-status-current-format "#{#[bg=#d0d0d0],#[fg=#1c1c1c,bold] #I:#W#{?window_flags,#F, } #[default]"
setw -g window-status-separator ""

set -g status-right-length 65
set -g status-right 'R:#(vmstat | awk "NR==3 { printf \"%%.1fG\",\$4 / 1024 }") D:#(df -h /home | awk "NR==2 {print \$4}") L:#(uptime | rev | cut -d":" -f1 | rev | tr -d "," | awk "{print \$1}" ) | %m-%d %H:%M'
